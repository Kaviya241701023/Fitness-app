<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d0f14" />
  <meta name="description" content="FitTrack Pro — Gym fitness tracker for calories, workouts, BMI & reminders" />
  <title>FitTrack Pro</title>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div id="app">

  <!-- ── Pages ─────────────────────────────────────────── -->
  <div id="page-dashboard"     class="page active"></div>
  <div id="page-calories"      class="page"></div>
  <div id="page-workout"       class="page"></div>
  <div id="page-bmi"           class="page"></div>
  <div id="page-notifications" class="page"></div>

  <!-- ── Bottom Navigation ─────────────────────────────── -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-page="dashboard" onclick="App.navigate('dashboard')">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Home</span>
      <span class="nav-dot"></span>
    </button>
    <button class="nav-item" data-page="calories" onclick="App.navigate('calories')">
      <span class="nav-icon">🍽️</span>
      <span class="nav-label">Calories</span>
      <span class="nav-dot"></span>
    </button>
    <button class="nav-item" data-page="workout" onclick="App.navigate('workout')">
      <span class="nav-icon">🏋️</span>
      <span class="nav-label">Workout</span>
      <span class="nav-dot"></span>
    </button>
    <button class="nav-item" data-page="bmi" onclick="App.navigate('bmi')">
      <span class="nav-icon">⚖️</span>
      <span class="nav-label">BMI</span>
      <span class="nav-dot"></span>
    </button>
    <button class="nav-item" data-page="notifications" onclick="App.navigate('notifications')">
      <span class="nav-icon">🔔</span>
      <span class="nav-label">Alerts</span>
      <span class="nav-dot"></span>
    </button>
  </nav>

  <!-- ── Toast Container ───────────────────────────────── -->
  <div id="toast-container"></div>

  <!-- ── Global Profile Modal ──────────────────────────── -->
  <div id="profile-modal" class="modal hidden">
    <div class="modal-box">
      <h2>⚙️ Edit Profile</h2>
      <div class="form-row">
        <label>Name</label>
        <input id="p-name" class="input" placeholder="Your name" />
      </div>
      <div class="form-row">
        <label>Age</label>
        <input id="p-age" class="input" type="number" min="10" max="100" />
      </div>
      <div class="form-row">
        <label>Height (cm)</label>
        <input id="p-height" class="input" type="number" min="100" max="250" />
      </div>
      <div class="form-row">
        <label>Weight (kg)</label>
        <input id="p-weight" class="input" type="number" min="30" max="300" step="0.1" />
      </div>
      <div class="form-row">
        <label>Daily Calorie Goal</label>
        <input id="p-cal-goal" class="input" type="number" min="1000" max="6000" />
      </div>
      <div class="form-row">
        <label>Fitness Goal</label>
        <select id="p-goal" class="input">
          <option value="muscle_gain">Muscle Gain</option>
          <option value="weight_loss">Weight Loss</option>
          <option value="maintain">Maintain</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="Pages.closeModal();document.getElementById('profile-modal').classList.add('hidden')">Cancel</button>
        <button class="btn-primary"   onclick="Pages.saveProfile()">Save Profile</button>
      </div>
    </div>
  </div>

</div><!-- /#app -->

<!-- ── Scripts (order matters) ───────────────────────── -->
<script src="data/mockData.js"></script>
<script src="js/app.js"></script>
<script src="js/pages.js"></script>
<script>
  // Boot the app
  document.addEventListener('DOMContentLoaded', () => App.init());
</script>

</body>
</html>
